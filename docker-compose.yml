services:
  postgres:
    image: postgres:17
    container_name: flowcommerce-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: flowcommerce
      POSTGRES_PASSWORD: flowcommerce
      POSTGRES_DB: flowcommerce
    volumes:
      - flowcommerce_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowcommerce -d flowcommerce']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  flowcommerce_postgres_data:
